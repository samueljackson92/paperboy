# Paperboy default configuration
# Copy to ~/.config/paperboy/config.toml and customise.

[arxiv]
# arXiv category codes to follow
categories = ["physics.plasm-ph", "cs.LG"]
# Keywords filtered server-side via arXiv query (title or abstract must match).
# Each keyword is ANDed with the category filter.
# Leave empty to fetch all papers in the listed categories.
keywords = []
limit = 50

[openreview]
limit = 50

# OpenReview venue entries — each venue can have its own keyword filter.
[[openreview.venues]]
id = "NeurIPS.cc/2025/Conference"
keywords = []   # e.g. ["reinforcement learning", "plasma"]

[[openreview.venues]]
id = "ICML.cc/2025/Conference"
keywords = []

# Journal RSS/Atom feeds — add any journal that publishes a feed.
# keyword filter applied post-fetch on title + abstract.
[[journals]]
name = "Nuclear Fusion"
feed_url = "https://iopscience.iop.org/journal/rss/0029-5515"
keywords = []

[[journals]]
name = "IEEE Transactions on Plasma Science"
feed_url = "https://ieeexplore.ieee.org/rss/TOC23.XML"
keywords = []

[app]
# How often (minutes) to auto-refresh in the background
refresh_interval_minutes = 30
# Total papers kept in memory across all sources
max_papers = 200
