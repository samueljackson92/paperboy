[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperboy-tui"
version = "0.1.0"
description = "A terminal RSS-style reader for arXiv, OpenReview, and journals"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "textual>=0.47.0",
    "httpx>=0.26.0",
    "openreview-py>=1.14.0",
    "aiosqlite>=0.19.0",
    "rich>=13.7.0",
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "textual-image>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "textual[dev]>=0.47.0",
    "ruff>=0.2.0",
    "ty>=0.0.0a1",
]

[project.scripts]
paperboy = "paperboy.app:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty]
python-version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
